<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Player Movement - Pertemuan 4</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <img class="background-image" src="bg.jpg" alt="">
  <div class="container">
    <h1>Catch the Coin</h1>
    <div class="canvas-wrap">
      <canvas id="gameCanvas" width="800" height="500"></canvas>
      <div id="dangerMessage" class="danger-message">Bahaya!</div>
      <div id="gameOverOverlay" class="game-over-overlay">
        <h2 id="gameOverTitle">Game Over</h2>
        <p id="gameOverText">Waktu habis!</p>
        <button id="restartButton">Main Lagi</button>
      </div>
    </div>
    <div class="dashboard">
      <div class="petunjuk">
        Gunakan <strong>WASD</strong> atau <strong>Arrow Key</strong> untuk menggerakkan pemain
      </div>
      <div class="status-grup">
        <div class="kolom">
          <p>Posisi X : <span id="posX">100</span></p>
          <p>Posisi Y : <span id="posY">100</span></p>
        </div>
        <div class="kolom">
          <p>Warna : <span id="playerColor">white</span></p>
          <p>Ukuran : <span id="playerSize">40x40</span></p>
        </div>
        <div class="kolom">
          <p>Speed : <span id="playerSpeed">5</span></p>
          <p>Skor : <span id="score">0</span></p>
        </div>
        <div class="kolom">
          <p>Waktu : <span id="timeLeft">30</span>s</p>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
